<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>ONG Solidária - Cadastro</title>
</head>

<body>
    <header>
        <h1>ONG Solidária</h1>

        <nav aria-label="Navegação principal">
            <a href="index.html">Início</a>
            <a href="projetos.html">Projetos</a>
            <a href="cadastro.html">Seja voluntário</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Cadastro de voluntário</h2>

            <p>
                Preencha seus dados para demonstrar interesse em participar
                das ações e projetos da nossa ONG.
            </p>

            <form action="#" method="post">
                <fieldset>
                    <legend>Dados pessoais</legend>

                    <p>
                        <label for="nome">Nome completo:</label>
                        <input type="text" id="nome" name="nome" required>
                    </p>

                    <p>
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" required>
                    </p>

                    <p>
                        <label for="nascimento">Data de nascimento:</label>
                        <input type="date" id="nascimento" name="nascimento" required>
                    </p>

                    <p>
                        <label for="cpf">CPF:</label>
                        <input
                            type="text"
                            id="cpf"
                            name="cpf"
                            pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
                            maxlength="14"
                            placeholder="000.000.000-00"
                            required
                        >
                    </p>

                    <p>
                        <label for="telefone">Telefone:</label>
                        <input
                            type="tel"
                            id="telefone"
                            name="telefone"
                            pattern="\([0-9]{2}\) [0-9]{4,5}-[0-9]{4}"
                            maxlength="15"
                            placeholder="(11) 99999-9999"
                            required
                        >
                    </p>
                </fieldset>

                <fieldset>
                    <legend>Endereço</legend>

                    <p>
                        <label for="cep">CEP:</label>
                        <input
                            type="text"
                            id="cep"
                            name="cep"
                            pattern="\d{5}-\d{3}"
                            maxlength="9"
                            placeholder="00000-000"
                            required
                        >
                    </p>

                    <p>
                        <label for="endereco">Endereço:</label>
                        <input type="text" id="endereco" name="endereco" required>
                    </p>

                    <p>
                        <label for="cidade">Cidade:</label>
                        <input type="text" id="cidade" name="cidade" required>
                    </p>

                    <p>
                        <label for="estado">Estado:</label>
                        <input type="text" id="estado" name="estado" maxlength="2" required>
                    </p>
                </fieldset>

                <button type="submit">Enviar cadastro</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ONG Solidária. Todos os direitos reservados.</p>
    </footer>
    <script type="module" src="../js/main.js"></script>
</body>
</html>
